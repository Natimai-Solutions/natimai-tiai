# Mises à jour de dépendances automatisées.
#
# Le dépôt a trois écosystèmes verrouillés (uv.lock, package-lock.json, go.sum),
# les actions de la CI et les images de conteneur (Dockerfile, compose) —
# chacun a son bloc ci-dessous. Dependabot ouvre une
# PR par groupe, que la CI valide comme n'importe quelle autre.
#
# Les mises à jour de sécurité (Dependabot alerts) ignorent `schedule` et
# `open-pull-requests-limit` : elles sont ouvertes dès la publication de l'avis.
version: 2

updates:
  # ── Backend Python (uv) ────────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      # Les patchs/mineures passent en un lot : elles sont sans risque dans les
      # bornes de pyproject.toml et la CI (ruff, mypy, pytest) les tranche.
      #
      # Les majeures ne sont volontairement pas groupées : sans groupe qui les
      # capte, Dependabot ouvre une PR par mise à jour. Une majeure infusable
      # ne peut donc pas retenir les autres en otage dans la même PR.
      backend-mineures:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Frontend (npm) ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      # Majeures non groupées, une PR chacune — voir le commentaire du backend.
      frontend-mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/node suit la version de Node ciblée (`engines`, setup-node@22),
      # pas la dernière publiée : une majeure ici décrit des API absentes du
      # runtime réel.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 est le portage natif en Go : son paquet n'expose plus
      # `typescript/lib/tsc`, or vue-tsc type-checke les composants `.vue` en
      # instrumentant précisément ce compilateur JS. `vue-tsc --noEmit` échoue
      # en ERR_PACKAGE_PATH_NOT_EXPORTED, et aucun réglage n'y change rien.
      # À rouvrir quand l'écosystème Vue aura un type-checker adossé à tsgo.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  # ── Agent Windows (Go) ─────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(agent)"
    groups:
      agent-modules:
        patterns: ["*"]

  # ── Images de base des Dockerfile (backend, console) ──────────────────────
  # python, node et nginx : les correctifs de sécurité de ces images arrivent
  # par leurs étiquettes, que rien d'autre ne fait avancer (audit S31). Le job
  # `images` de la CI construit les deux images de chaque PR.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(images)"
    groups:
      # Majeures non groupées, une PR chacune — voir le commentaire du backend.
      images-mineures:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Images tierces de la stack (deploy/docker-compose.yml) ─────────────────
  # postgres (db et db-backup) et caddy. Les images tiai-* suivent TIAI_VERSION
  # et ne sont pas concernées.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(deploy)"
    groups:
      deploy-mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Une majeure de PostgreSQL change le format du répertoire de données :
      # le nouveau serveur refuse de démarrer sur le volume existant sans
      # pg_upgrade ou dump/restauration. C'est une opération de maintenance
      # à planifier, pas une PR de dépendance.
      - dependency-name: "postgres"
        update-types: [version-update:semver-major]

  # ── Actions GitHub (ci.yml, release.yml) ───────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
