# Sécurité en continu (repris de natimai-paie) : secrets commis, dépendances
# vulnérables des trois écosystèmes, analyse statique. Les images sont
# scannées par Trivy dans ci.yml (job `images`), là où elles sont construites.
#
# Économie de minutes : sur les PR prêtes seulement (pas en brouillon), sans
# nouvelle passe à la fusion, et chaque lundi pour les bases de
# vulnérabilités qui évoluent sans que le dépôt change. Les audits tiennent en
# un job : chacun coûtait au moins une minute facturée pour quelques
# secondes de travail. Chaque checkout oublie son jeton
# (persist-credentials: false, audit S29) : aucun job ne pousse.
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audits:
    name: Secrets et dépendances (gitleaks · pip-audit · npm audit · govulncheck)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Binaire vérifié par empreinte plutôt qu'une action tierce : rien
      # d'autre que gitleaks ne tourne avec l'historique complet du dépôt.
      - name: gitleaks sur tout l'historique
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL --fail --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --no-emit-project : le paquet local n'est pas sur PyPI, pip-audit ne
      # saurait pas l'auditer (et n'a pas à le faire).
      - name: Dépendances Python (pip-audit)
        if: success() || failure()
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: success() || failure()
        with:
          node-version: 22
      # Lit le lockfile, sans rien installer.
      - name: Dépendances JavaScript (npm audit)
        if: success() || failure()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: success() || failure()
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # govulncheck ne signale que le code réellement atteint, bibliothèque
      # standard comprise : une alerte ici vise le binaire publié, qui est
      # compilé avec cette même version de Go (release.yml). Deux passes, car
      # le vrai code de l'agent est derrière l'étiquette de build windows.
      # L'outil est installé avant, pour le runner : avec `go run` sous
      # GOOS=windows, il serait compilé en .exe et ne pourrait pas s'exécuter.
      - name: Dépendances Go (govulncheck)
        if: success() || failure()
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows govulncheck ./...
          govulncheck ./...

  semgrep:
    name: Analyse statique (Semgrep)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Règles maison (.semgrep/) : les invariants propres à Tia'i, bloquants.
      - name: Règles maison
        run: uvx semgrep@1.182.1 scan --metrics=off --error --config .semgrep/ .
      # Packs du registre : informatifs tant que leur premier passage n'a pas
      # été trié — un constat accepté s'annote `# nosemgrep: <id>` avec sa
      # raison, puis l'étape devient bloquante (retirer continue-on-error).
      # Le lundi et à la demande seulement : informatifs, ils ne bloquent rien
      # et coûtaient plusieurs minutes à chaque push.
      - name: Packs du registre (informatif)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: >-
          uvx semgrep@1.182.1 scan --metrics=off --error
          --config p/python --config p/gosec --config p/typescript
          --config p/dockerfile --config p/docker-compose
          --config p/github-actions --config p/secrets .
