name: CI

# Économie de minutes (les Actions sont facturées) :
# - pas de CI sur une PR en brouillon : elle part quand la PR passe « prête »
#   (ready_for_review), puis à chaque push tant qu'elle l'est ;
# - pas de nouvelle suite à la fusion : la PR l'a déjà passée, et la règle
#   « Require branches to be up to date » de la protection de main garantit
#   que le commit testé est celui qui est fusionné ;
# - chaque job ne part que si sa partie du dépôt a changé (job `changes`) ;
#   `Tout est vert`, toujours exécuté, est le seul statut à exiger ;
# - une passe complète chaque lundi sur main (dérive des dépendances, images,
#   badges de couverture), et à la demande (workflow_dispatch).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (audit S29): read only, and the two jobs that comment
# coverage on a PR get that one right on their own. Every checkout drops its
# token (persist-credentials: false): no job pushes with it, so it does not
# stay in .git/config within reach of the steps that follow.
permissions:
  contents: read

jobs:
  # Ce que la PR touche, lu dans l'API (pas de checkout). Hors PR (lundi, à la
  # demande) tout est vrai. Une PR en brouillon ne lance rien.
  changes:
    name: Parties modifiées
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      agent: ${{ steps.paths.outputs.agent }}
      e2e: ${{ steps.paths.outputs.e2e }}
      images: ${{ steps.paths.outputs.images }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            for k in backend frontend agent e2e images; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          cat files.txt
          has() { grep -qE "$1" files.txt && echo true || echo false; }
          # La CI elle-même : tout repart, pour qu'un changement de workflow
          # soit essayé sur tous les jobs.
          ci='^\.github/workflows/ci\.yml$'
          {
            # deploy/backup : tests/test_backup_script.py lance backup.sh.
            echo "backend=$(has "^backend/|^deploy/backup/|$ci")"
            echo "frontend=$(has "^frontend/|$ci")"
            echo "agent=$(has "^agent/|$ci")"
            echo "e2e=$(has "^(backend|frontend|deploy)/|$ci")"
            # Images (construction + Trivy) : seulement si leur base ou leurs
            # dépendances changent. Le code, lui, est construit dans l'image
            # par l'e2e (docker compose --build) ; le lundi, tout est rescanné.
            echo "images=$(has "^(backend|frontend)/(Dockerfile|\.dockerignore|uv\.lock|pyproject\.toml|package(-lock)?\.json|nginx\.conf)$|$ci")"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint · types · tests · coverage)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment on the PR
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tiai
          POSTGRES_PASSWORD: tiai
          POSTGRES_DB: tiai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiai -d tiai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TIAI_TEST_DATABASE_URL: postgresql+psycopg://tiai:tiai@localhost:5432/tiai_test
      # Sans base, les tests d'API seraient sautés et la CI resterait verte :
      # ici, une variable manquante est une erreur (tests/conftest.py).
      TIAI_REQUIRE_TEST_DB: "1"
      # Whether the optional PAT (scope `gist`) for the coverage badge exists —
      # a boolean, not the token: the PAT itself only reaches the badge step
      # (audit S30), not every step running the project's code.
      HAS_GIST_SECRET: ${{ secrets.GIST_SECRET != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # tests/test_backup_script.py lance deploy/backup/backup.sh pour de vrai :
      # chiffrement avec age, et sous le shell du conteneur (busybox ash).
      # Sans ces deux outils, ces tests étaient sautés en silence ; ici (CI
      # posé), leur absence les fait échouer.
      - name: Outils des tests de sauvegarde (age, busybox)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age busybox-static
          age --version && busybox | head -n 1

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy app

      - name: Pytest (+ coverage)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=json

      - name: Coverage comment (PR)
        # Skipped on fork PRs: GITHUB_TOKEN is read-only there and can't post comments.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@4cfb48edc8f875ac019afdcfd97c48d78ad2b723 # v1.13.1
        with:
          title: Couverture backend
          pytest-xml-coverage-path: backend/coverage.xml
          unique-id-for-comment: backend

      - name: Read backend coverage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_GIST_SECRET == 'true'
        id: cov
        run: echo "pct=$(node -p "Math.round(require('./coverage.json').totals.percent_covered)")" >> "$GITHUB_OUTPUT"

      - name: Coverage badge (gist)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_GIST_SECRET == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 80b72bc52448a36bc1a08370a68c88a1
          filename: tiai-coverage-backend.json
          label: couverture backend
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 30
          maxColorRange: 90

  agent:
    name: Agent (gofmt · vet · tests · builds)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      # -race : la boucle de polling et le worker de commandes tournent sur des
      # goroutines distinctes et partagent client HTTP, file locale et table des
      # commandes en vol.
      - name: Tests
        run: go test -race ./...

      # Build tags split dev stubs (linux, exercised above) from the real
      # Windows code — cross-compiling checks the latter still compiles.
      - name: Build windows/amd64
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64

  agent-windows:
    name: Agent (tests Windows)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 25
    # Les *_windows_test.go (scripts PowerShell parsés par PowerShell lui-même,
    # encodage des sorties System32, DPAPI, DACL) ne compilent que sous
    # Windows : le job Linux ci-dessus ne les a jamais exécutés. Aucun ne
    # suppose Defender, un domaine ni le Security Center ; les tests de DACL
    # visent une clé HKCU et un dossier temporaires, jamais HKLM.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # Sans -race : sous Windows il exige cgo et une toolchain C ; les courses
      # sont déjà traquées par le job Linux, sur le même code partagé.
      - name: Tests
        run: go test -count=1 ./...

  frontend:
    name: Frontend (format · tests · coverage)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment on the PR
    defaults:
      run:
        working-directory: frontend

    env:
      HAS_GIST_SECRET: ${{ secrets.GIST_SECRET != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      # Correctness rules Prettier and vue-tsc do not cover (a mutated prop, a
      # floating promise, a variable never used). Warnings fail the step too:
      # a warning nobody has to fix is a warning nobody reads.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (+ coverage)
        run: npm run test:coverage

      # Le typecheck ne compile pas la SPA : une erreur de bundling (import
      # dynamique, asset, config Quasar) ne se voit qu'ici.
      - name: Build
        run: npm run build

      - name: Coverage comment (PR)
        # Skipped on fork PRs: GITHUB_TOKEN is read-only there and can't post comments.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2
        with:
          working-directory: frontend
          name: Couverture frontend

      - name: Read frontend coverage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_GIST_SECRET == 'true'
        id: cov
        run: echo "pct=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")" >> "$GITHUB_OUTPUT"

      - name: Coverage badge (gist)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_GIST_SECRET == 'true'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 80b72bc52448a36bc1a08370a68c88a1
          filename: tiai-coverage-frontend.json
          label: couverture frontend
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 30
          maxColorRange: 90

  images:
    name: Images Docker (build · Trivy)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # Ne publie rien : vérifie que les deux Dockerfiles construisent encore,
    # pour qu'une release ne découvre pas la casse au moment de pousser, et
    # scanne l'image construite.
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.component }}
          push: false
          load: true
          tags: tiai-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Le scan de l'image vient d'ici plutôt que de security.yml : l'image
      # n'est construite qu'une fois. Le lundi, il repasse sur main, pour les
      # vulnérabilités publiées depuis.
      - name: Trivy ${{ matrix.component }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tiai-${{ matrix.component }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: Console (bout en bout)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The console in a real browser against the real stack, as Compose runs it
    # (Caddy, API, worker, PostgreSQL): login and session cookie, a command
    # from a button to the database and back, the audit log, a setting that
    # survives a reload. The wiring unit tests cannot see.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Préparer la stack de test
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^TIAI_SERVER_NAME=.*/TIAI_SERVER_NAME=localhost/; s/^ENVIRONMENT=.*/ENVIRONMENT=local/' .env

      # Override de dev : `tls internal` (AC locale de Caddy) et secrets
      # d'exemple acceptés. --build : les images du commit testé, jamais
      # celles du registre.
      - name: Démarrer la stack
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 300

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Installer Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        working-directory: frontend
        run: npm run test:e2e

      - name: Journaux de la stack (en cas d'échec)
        if: failure()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail 200

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Le seul statut à exiger dans la protection de main : vert quand chaque job
  # lancé a réussi, un job sauté (partie non modifiée) compte comme réussi.
  # Toujours exécuté, pour qu'un job sauté ne laisse pas le statut en attente.
  all-green:
    name: Tout est vert
    needs: [changes, backend, agent, agent-windows, frontend, images, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Résultat des jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        # Sur une PR en brouillon, tout est sauté : vert, et rien ne peut être
        # fusionné tant qu'elle l'est ; le passage « prête » relance tout.
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
