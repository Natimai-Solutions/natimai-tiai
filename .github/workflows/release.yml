# Publie les binaires Windows de l'agent (.exe et installateur .msi) sur la
# page Releases du dépôt, et les images Docker du serveur (backend, console)
# sur ghcr.io.
#
# Déclenchement :
#   - tag `v*` poussé sur le dépôt  → crée la release et y attache .exe + .msi ;
#   - release publiée depuis l'interface web (quel que soit le nom du tag)
#     → compile et attache les binaires à cette release ;
#   - lancement manuel (Actions → Release → Run workflow) → produit les mêmes
#     binaires en artefacts de build, sans créer de release.
#
# Publier une version :
#   git tag -a v0.2.0 -m "Agent v0.2.0" && git push origin v0.2.0
#
# La version du tag est injectée dans le binaire (`-X ...agent.Version`), donc
# `tiai-agent.exe version` et le champ `agent_version` des heartbeats la
# reflètent — pas besoin de modifier le code source pour publier.
#
# Quatre jobs : les .exe se cross-compilent sur Linux ; le runner Windows les
# signe, construit les .msi autour des .exe signés et signe ces .msi à leur
# tour (WiX et signtool y sont chez eux) ; les images Docker se construisent en
# parallèle ; la publication attend le tout pour attacher un jeu complet —
# binaires, installateurs et empreintes — ou rien.
#
# Signature Authenticode : par le certificat fourni dans les secrets du dépôt
# (SIGNING_CERT_PFX_BASE64, SIGNING_CERT_PASSWORD), cf. DEPLOYMENT.md
# § « Signature de l'agent ». Sans ces secrets, les binaires partent non signés
# avec un avertissement ; la variable REQUIRE_SIGNING=true en fait une erreur.
#
# Images : ghcr.io/natimai-solutions/tiai-backend:<version> et
# tiai-frontend:<version>, plus `latest` pour une version sans suffixe
# (v1.2.0, pas v1.2.0-rc.1). Poussées seulement sur un tag ; un lancement
# manuel les construit sans les publier.
#
# Chaque release porte exactement cinq fichiers, toujours nommés pareil :
#   tiai-agent-windows-amd64.exe   tiai-agent-windows-arm64.exe
#   tiai-agent-windows-amd64.msi   tiai-agent-windows-arm64.msi
#   SHA256SUMS.txt
# Pas d'exemplaire versionné en plus : la version est dans le tag, dans le
# binaire et dans les empreintes, et deux noms pour un même fichier ne
# faisaient qu'embrouiller le choix. Les anciennes releases restent
# téléchargeables depuis la page Releases, chacune sous son tag.
name: Release

on:
  push:
    tags: ["v*"]
  # Filet de sécurité : une release créée depuis l'interface web avec un tag
  # sans préfixe `v` (ex. `0.0.3`) ne matche pas `push: tags` — cet événement
  # garantit la compilation dans tous les cas. Si le tag est en `v*`, les deux
  # événements se déclenchent : la concurrence par ref les sérialise et le
  # second téléverse simplement à nouveau (`--clobber`), sans doublon.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # créer la release et téléverser les binaires
  packages: write # pousser les images Docker sur ghcr.io

jobs:
  agent:
    name: Agent Windows (.exe)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # Filet de sécurité : on ne publie pas un binaire dont les tests échouent.
      - name: Tests
        working-directory: agent
        run: go test ./...

      - name: Résoudre la version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version : ${version}"

      # Go cross-compile sans toolchain externe : les deux cibles en quelques
      # secondes, dans le même job (pas d'aller-retour par artefacts).
      #
      # Un seul fichier par architecture, au nom fixe : la version est dans le
      # tag de la release, dans le binaire (`tiai-agent.exe version`) et dans
      # SHA256SUMS.txt — un second exemplaire au nom versionné ne faisait que
      # doubler la liste des fichiers sans dire lequel prendre. Le nom fixe est
      # aussi ce qui fait marcher les liens `releases/latest/download/<nom>`.
      - name: Build
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            echo "→ windows/${arch} (${VERSION})"
            GOOS=windows GOARCH="${arch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X tiai/agent/internal/agent.Version=${VERSION}" \
              -o "../dist/tiai-agent-windows-${arch}.exe" .
          done

      # Permet de vérifier l'intégrité du binaire avant déploiement GPO. Les
      # empreintes définitives (exe + msi) sont recalculées à la publication.
      - name: Empreintes SHA-256
        working-directory: dist
        run: |
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Artefact de build
        uses: actions/upload-artifact@v7
        with:
          name: tiai-agent-exe-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  msi:
    name: Signature et installateur Windows (.msi)
    runs-on: windows-latest # WiX et signtool sont chez eux sous Windows
    needs: agent

    env:
      # Épinglée : l'extension doit correspondre exactement à la version du CLI
      # (sinon WIX0144), et l'eulaId `wix7` accepté ci-dessous est propre à
      # cette version majeure. Un `latest` implicite a déjà cassé le build à
      # l'entrée en vigueur de l'EULA OSMF de WiX v7 (août 2026).
      WIX_VERSION: "7.0.0"

    steps:
      - uses: actions/checkout@v7 # pour deploy/msi/Package.wxs

      - name: Récupérer les .exe
        uses: actions/download-artifact@v8
        with:
          name: tiai-agent-exe-${{ needs.agent.outputs.version }}
          path: dist

      # Avant le MSI : le .exe que le MSI embarque, et donc le service
      # installé sur chaque poste, est ainsi le binaire signé.
      - name: Signer les .exe
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: ./.github/scripts/Sign-Authenticode.ps1 -Path (Get-ChildItem dist/*.exe).FullName

      # `update` plutôt que `install` : idempotent si l'image du runner
      # embarque déjà l'outil.
      #
      # WiX v7 exige d'accepter l'EULA « Open Source Maintenance Fee »
      # (https://wixtoolset.org/osmf/) avant toute commande : sans acceptation,
      # `extension add` échoue (WIX7015) et le build ne trouve ensuite pas
      # l'extension (WIX0144). `wix eula accept` vaut pour tout le job.
      #
      # `shell: bash` et non le PowerShell par défaut : bash est lancé avec
      # `-e`, donc l'échec d'une commande intermédiaire fait échouer l'étape —
      # en PowerShell, seul le code de sortie de la dernière commande compte,
      # ce qui a déjà masqué un `extension add` en échec.
      - name: Installer WiX
        shell: bash
        run: |
          dotnet tool update --global wix --version "${WIX_VERSION}"
          wix eula accept wix7
          wix extension add --global "WixToolset.Util.wixext/${WIX_VERSION}"
          wix extension list --global

      # Même règle que pour les .exe : un fichier par architecture, au nom fixe.
      - name: Build MSI
        shell: bash
        env:
          VERSION: ${{ needs.agent.outputs.version }}
        run: |
          # Windows Installer exige une version numérique x.y.z : on tronque le
          # suffixe des builds de dev (0.0.0-dev.abc123 → 0.0.0). La version
          # complète reste dans le binaire embarqué.
          msi_version="${VERSION%%-*}"
          for arch in amd64 arm64; do
            case "${arch}" in
              amd64) wix_arch=x64 ;;
              *)     wix_arch="${arch}" ;;
            esac
            echo "→ msi windows/${arch} (${VERSION}, MSI ${msi_version})"
            wix build deploy/msi/Package.wxs \
              -ext "WixToolset.Util.wixext/${WIX_VERSION}" \
              -arch "${wix_arch}" \
              -d ProductVersion="${msi_version}" \
              -d AgentExe="dist/tiai-agent-windows-${arch}.exe" \
              -o "dist/tiai-agent-windows-${arch}.msi"
          done

      - name: Signer les .msi
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: ./.github/scripts/Sign-Authenticode.ps1 -Path (Get-ChildItem dist/*.msi).FullName

      # Le jeu publiable : les .exe tels que signés ici, et les .msi qui les
      # embarquent. Les .exe non signés du job `agent` ne sont jamais publiés.
      - name: Artefact de build
        uses: actions/upload-artifact@v7
        with:
          name: tiai-agent-windows-${{ needs.agent.outputs.version }}
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  images:
    name: Image Docker (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: agent
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Le nom d'image doit être en minuscules ; le propriétaire du dépôt ne
      # l'est pas (Natimai-Solutions). `latest` ne suit que les versions
      # stables : une release candidate ne doit pas s'installer par défaut.
      - name: Étiquettes
        id: tags
        env:
          VERSION: ${{ needs.agent.outputs.version }}
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tiai-${COMPONENT}"
          tags="${image}:${VERSION}"
          case "${VERSION}" in
            *-*) ;;
            *) tags="${tags},${image}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Étiquettes : ${tags}"

      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=tiai-${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.agent.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish:
    name: Publier la release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [agent, msi, images]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes a besoin de l'historique des tags

      # Seulement l'artefact du job Windows : il porte les .exe signés.
      # Celui du job `agent` contient les mêmes .exe avant signature.
      - name: Rassembler les binaires
        uses: actions/download-artifact@v8
        with:
          name: tiai-agent-windows-${{ needs.agent.outputs.version }}
          path: dist

      # Recalculées ici pour couvrir exe et msi dans un seul fichier.
      - name: Empreintes SHA-256
        working-directory: dist
        run: |
          sha256sum *.exe *.msi | tee SHA256SUMS.txt

      # Une release peut déjà exister pour ce tag : créée depuis l'interface web
      # (ce qui pousse le tag et déclenche donc ce workflow), ou laissée par une
      # exécution précédente que l'on rejoue. `gh release create` échoue dans ce
      # cas — on téléverse alors dans la release existante.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} déjà présente → mise à jour des binaires."
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.exe dist/*.msi dist/SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Tiai ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*.exe dist/*.msi dist/SHA256SUMS.txt
          fi
