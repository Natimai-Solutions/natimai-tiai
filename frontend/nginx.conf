server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Sortie hachée du build (dist/spa/assets/, `nom-<empreinte>.ext`) : le nom
    # change avec le contenu, le fichier se garde un an sans revalidation. La
    # règle porte sur ce préfixe, pas sur l'extension : un fichier non haché
    # (favicon, contenu de public/) ne reçoit jamais `immutable` (audit S34).
    # Un asset absent répond 404, jamais l'index.html du repli SPA, qui serait
    # alors gardé un an sous le nom d'un script.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html jamais en cache : c'est lui qui nomme les fichiers JS/CSS
    # (hachés) de la version en cours. Mis en cache, il réclamerait après une
    # mise à jour des fichiers qui n'existent plus (audit S34).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — toutes les routes vers index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
